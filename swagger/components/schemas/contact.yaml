type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+381234567890'
  email:
    description: "Contact's email address"
    type: string
    example: 'john.doe@example.com'
  isFavourite:
    description: 'Whether the contact is marked as favorite'
    type: boolean
    example: true
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    example: 'personal'
  userId:
    description: 'ID of the user who owns the contact'
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to the contact's photo (Cloudinary URL or local file path)"
    type: string
    example: 'https://res.cloudinary.com/uqwgdu/image/upload/image.png'
    # Example with local file path:
    # example: "/uploads/1711902756000-profile.jpg"
